name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yaml

  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: release
    needs: ci
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        toolchain: stable
        cache: false

    - name: Check tag matches version
      run: |
        version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')"
        if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version}"
          exit 1
        fi

    - id: auth
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

    - name: Publish
      run: cargo publish --features rt-tokio-crypto-rust
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
